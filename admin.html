<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Jalora</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/style.css"><style>table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top;font-size:.9rem}nav button{margin:0 6px 8px 0}</style></head><body>
<header><a href="/">← Jalora home</a></header><main><h1>Admin</h1>
<div class="card" id="lg"><label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password"><p><button class="btn" onclick="login()">Sign in</button></p><div id="le"></div></div>
<div id="ap" style="display:none"><nav><button class="btn ghost" onclick="tab('c')">Complaints</button><button class="btn ghost" onclick="tab('a')">Authorities</button><button class="btn ghost" onclick="tab('t')">Team files</button><button class="btn ghost" onclick="tab('l')">Audit log</button></nav><div id="v" class="card"></div></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let T='',cfg;
const api=(u,b)=>fetch(u,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
async function login(){cfg=await (await fetch('/api/config')).json();const r=await fetch(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});const j=await r.json();
if(!j.access_token){le.textContent='Sign-in failed.';return}T=j.access_token;const t=await api('/api/admin?what=audit');if(t.error){le.textContent='This account is not an admin.';return}lg.style.display='none';ap.style.display='block';tab('c')}
async function tab(x){v.innerHTML='Loading…';
if(x=='c'){const L=await api('/api/admin?what=complaints');v.innerHTML='<table><tr><th>Ref</th><th>Where / what</th><th>Email</th><th>Status</th></tr>'+L.map(c=>`<tr><td>${esc(c.reference)}<br>${new Date(c.created_at).toLocaleDateString()}</td><td>${esc(c.state)}, ${esc(c.district)}, ${esc(c.locality)}<br>${esc(c.category)}<br>${esc(c.description)}<br>${esc(c.email||'')}</td><td>${esc(c.authorities?.name||'no authority')}<br>${esc(c.email_status)} ${esc(c.email_error||'')}<br>${c.email_status!='accepted'?`<button class="btn ghost" onclick="retry('${c.id}')">Retry email</button>`:''}</td><td><select onchange="setSt('${c.id}',this.value)">${['submitted','email_pending','email_accepted','email_failed','acknowledged','under_review','resolved','closed'].map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</table>'}
if(x=='a'){const L=await api('/api/admin?what=authorities');v.innerHTML=`<h3>Add verified authority</h3><p style="color:var(--mut)">Only add an email copied from an official government page. Set the verified date only after you checked it.</p>
<input id="an" placeholder="Authority name"><select id="as">${cfg.states.map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id="ad" placeholder="District (blank = whole state)"><input id="am" placeholder="Official email (optional)" type="email"><input id="au" placeholder="Portal URL (optional)"><input id="aso" placeholder="Official source URL (required)"><label>Verified on</label><input id="av" type="date"><p><button class="btn" onclick="addA()">Save</button></p>
<table><tr><th>Name</th><th>Area</th><th>Email</th><th>Verified</th><th>Active</th></tr>${L.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.state)} ${esc(a.district||'')}</td><td>${esc(a.contact_email||'')}</td><td>${esc(a.verified_on||'NO')}</td><td><button class="btn ghost" onclick='tog(${JSON.stringify(a).replace(/'/g,"&#39;")})'>${a.active?'Disable':'Enable'}</button></td></tr>`).join('')}</table>`}
if(x=='t'){const L=await (await fetch('/api/team')).json();v.innerHTML=L.map(m=>`<div class="msg"><b>${esc(m.name)}</b> (${esc(m.roll_no)})<br>Photo: ${m.photo?'uploaded':'none'} · PDF: ${esc(m.pdf_name||'none')}<br>
<input type="file" accept=".jpg,.jpeg,.png,.webp" onchange="up('${m.id}','photo',this)"> <input type="file" accept="application/pdf" onchange="up('${m.id}','pdf',this)"> <button class="btn ghost" onclick="rm('${m.id}','photo')">Remove photo</button> <button class="btn ghost" onclick="rm('${m.id}','pdf')">Remove PDF</button></div>`).join('')}
if(x=='l'){const L=await api('/api/admin?what=audit');v.innerHTML='<table>'+L.map(l=>`<tr><td>${new Date(l.at).toLocaleString()}</td><td>${esc(l.actor)}</td><td>${esc(l.action)}</td><td>${esc(JSON.stringify(l.detail))}</td></tr>`).join('')+'</table>'}}
async function setSt(id,s){const n=prompt('Public note for the complainant (optional)')||null;await api('/api/admin',{action:'status',id,status:s,publicNote:n})}
async function retry(id){const r=await api('/api/admin',{action:'retry',id});alert('Result: '+(r.result||r.error));tab('c')}
async function addA(){const r=await api('/api/admin',{action:'authority',authority:{name:an.value,state:as.value,district:ad.value,contact_email:am.value,portal_url:au.value,source_url:aso.value,verified_on:av.value||null}});alert(r.error||'Saved');tab('a')}
async function tog(a){a.active=!a.active;await api('/api/admin',{action:'authority',authority:a});tab('a')}
async function up(id,kind,inp){const f=inp.files[0];if(!f)return;const s=await api('/api/team',{action:'sign',id,kind,name:f.name,type:f.type,size:f.size});if(s.error){alert(s.error);return}
const fd=new FormData();fd.append('cacheControl','3600');fd.append('',f);const r=await fetch(s.url,{method:'PUT',body:fd});if(!r.ok){alert('Upload failed');return}
const c=await api('/api/team',{action:'commit',id,kind,name:f.name,path:s.path});alert(c.error||'Uploaded');tab('t')}
async function rm(id,kind){if(confirm('Remove?')){await api('/api/team',{action:'remove',id,kind});tab('t')}}
</script></body></html>
